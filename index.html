<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Feed TV</title>

  <link
    rel="stylesheet"
    href="/style.css">

</head>


<body class="tv-page">

  <div id="tvStage">

    <main id="tvRoot"></main>


    <div
      id="feedWatermark"
      class="feed-watermark">
      @FeedTV
    </div>


    <div class="tv-progress">

      <span id="progress"></span>

    </div>


    <div
      class="tv-count"
      id="count">

      0 / 0

    </div>

  </div>


  <div
    id="cursor"
    class="fake-cursor">

    ➤

  </div>


  <script src="/tv.js"></script>

</body>

</html>
