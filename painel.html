<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel • LCC TV</title><link rel="stylesheet" href="/style.css"></head><body class="panel"><header class="paneltop"><b>LCC TV</b><a href="/">Abrir TV</a></header><section class="hero"><div><small>PAINEL DE CONTROLE</small><h1>Sua TV, alimentada pelo Instagram.</h1><p>Conecte o @lccimpressos e teste os conteúdos publicados.</p></div><a class="btn" href="/auth/instagram">Conectar Instagram</a></section><div id="status" class="status">Verificando conexão...</div><section id="grid" class="grid"></section><script>
async function load(){let s=await fetch('/api/status').then(r=>r.json());let st=document.getElementById('status');if(!s.connected){st.innerHTML='<b>Instagram não conectado.</b> Clique em Conectar Instagram.';return}st.innerHTML='<b>Conectado:</b> @'+s.username+' <button onclick="off()">Desconectar</button>';let d=await fetch('/api/media?limit=50').then(r=>r.json());document.getElementById('grid').innerHTML=(d.data||[]).map(x=>{let src=x.media_type==='VIDEO'?x.thumbnail_url:x.media_url;return `<article><img src="${src||''}"><div><b>${x.media_type}</b><small>${new Date(x.timestamp).toLocaleString('pt-BR')}</small><p>${(x.caption||'').slice(0,120)}</p></div></article>`}).join('')}async function off(){await fetch('/api/disconnect',{method:'POST'});load()}load();</script></body></html>
